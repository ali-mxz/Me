name: Bitpin Crypto Watchlist Bot

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

env:
  TZ: 'Asia/Tehran'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests jdatetime

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          PINNED_MSG_ID: ${{ secrets.PINNED_MSG_ID }}
        run: python bot.py
