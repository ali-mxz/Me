<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Watch Lizard Live Chart</title>
  <script src="https://telegram.org"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #131722;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #header {
      padding: 10px 14px;
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
    }
    #price-tag { color: #26a69a; font-family: monospace; font-size: 15px; }
    #chart { flex: 1; width: 100%; }
    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 13px;
      color: #787b86;
      text-align: center;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <div id="header">
    <span id="sym-title">Loading...</span>
    <span id="price-tag">--</span>
  </div>
  <div id="status">Loading live candles...</div>
  <div id="chart"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let rawParam = tg.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get("tgWebAppStartParam") || "BINANCE_BTCUSDT";
    let baseKey = rawParam.split("_").pop().replace("USDT", "").replace("USD", "");
    let titleSym = baseKey === "TON" ? "GRAM (TON)" : baseKey;
    document.getElementById("sym-title").innerText = "🦎 " + titleSym + " / USDT (15m)";

    const chart = LightweightCharts.createChart(document.getElementById("chart"), {
      layout: { background: { color: "#131722" }, textColor: "#d1d4dc" },
      grid: { vertLines: { color: "#1f2937" }, horzLines: { color: "#1f2937" } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      timeScale: { timeVisible: true, secondsVisible: false, borderColor: "#2a2e39" },
      rightPriceScale: { borderColor: "#2a2e39" }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: "#26a69a",
      downColor: "#ef5350",
      borderVisible: false,
      wickUpColor: "#26a69a",
      wickDownColor: "#ef5350"
    });

    // نگاشت نمادهای خاص به بازارهای موجود در نوبیتکس
    const nobitexMap = {
      "USDT": "USDTIRT",
      "SILVER": "PAXGUSDT",
      "HG1": "BTCUSDT",
      "USOIL": "BTCUSDT"
    };

    const symbol = nobitexMap[baseKey] || (baseKey + "USDT");
    if (baseKey === "USDT") {
      document.getElementById("sym-title").innerText = "🦎 USDT / IRT (15m)";
    } else if (["SILVER", "HG1", "USOIL"].includes(baseKey)) {
      document.getElementById("status").innerText = "Commodity chart not supported on Nobitex API.";
    }

    if (!["SILVER", "HG1", "USOIL"].includes(baseKey)) {
      const to = Math.floor(Date.now() / 1000);
      const from = to - (120 * 15 * 60);

      fetch(`https://nobitex.ir{symbol}&resolution=15&from=${from}&to=${to}`)
        .then(r => r.json())
        .then(data => {
          if (data.s !== "ok" || !data.t || !data.t.length) throw new Error("No data");
          const candles = data.t.map((ts, i) => ({
            time: Number(ts) + 12600,
            open: parseFloat(data.o[i]),
            high: parseFloat(data.h[i]),
            low: parseFloat(data.l[i]),
            close: parseFloat(data.c[i])
          }));
          candleSeries.setData(candles);
          const lastClose = candles[candles.length - 1].close;
          document.getElementById("price-tag").innerText = (baseKey === "USDT" ? "" : "$") + lastClose.toLocaleString();
          document.getElementById("status").style.display = "none";
          chart.timeScale().fitContent();
        })
        .catch(() => {
          document.getElementById("status").innerText = "Data unavailable for " + baseKey;
        });
    }

    window.addEventListener("resize", () => {
      chart.applyOptions({ width: window.innerWidth, height: window.innerHeight - 42 });
    });
  </script>
</body>
</html>
