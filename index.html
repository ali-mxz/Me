<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lizhart</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #131722;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #top {
      padding: 12px 16px;
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #sym { font-size: 16px; font-weight: 700; }
    #prc { font-size: 16px; font-weight: 700; color: #26a69a; font-family: monospace; }
    #wrap { flex: 1; position: relative; width: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #848e9c;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="top">
    <span id="sym">🦎 Loading...</span>
    <span id="prc">--</span>
  </div>
  <div id="wrap">
    <div id="msg">Loading chart...</div>
    <canvas id="cv"></canvas>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let param = tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get("tgWebAppStartParam") || "BINANCE_BTCUSDT";
    let key = param.split("_").pop().replace("USDT", "").replace("USD", "");
    document.getElementById("sym").innerText = "🦎 " + (key === "TON" ? "GRAM" : key) + " / USD (15m)";

    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");
    let candles = [];

    function draw() {
      if (!candles.length) return;
      const dpr = window.devicePixelRatio || 1;
      const w = cv.clientWidth;
      const h = cv.clientHeight;
      cv.width = w * dpr;
      cv.height = h * dpr;
      ctx.scale(dpr, dpr);

      ctx.fillStyle = "#131722";
      ctx.fillRect(0, 0, w, h);

      const padR = 62, padT = 18, padB = 24;
      const cw = w - padR;
      const ch = h - padT - padB;

      let min = Infinity, max = -Infinity;
      for (const c of candles) {
        if (c.low < min) min = c.low;
        if (c.high > max) max = c.high;
      }
      const range = (max - min) || 1;

      ctx.strokeStyle = "#1e222d";
      ctx.fillStyle = "#787b86";
      ctx.font = "11px monospace";
      ctx.textAlign = "left";
      for (let i = 0; i <= 4; i++) {
        const y = padT + (ch * i / 4);
        const val = max - (range * i / 4);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
        const label = val >= 100 ? val.toFixed(1) : (val >= 1 ? val.toFixed(3) : val.toFixed(6));
        ctx.fillText(label, cw + 6, y + 4);
      }

      const step = cw / candles.length;
      const bodyW = Math.max(2, step * 0.65);

      for (let i = 0; i < candles.length; i++) {
        const c = candles.at(i);
        const x = i * step + step / 2;
        const yO = padT + ((max - c.open) / range) * ch;
        const yC = padT + ((max - c.close) / range) * ch;
        const yH = padT + ((max - c.high) / range) * ch;
        const yL = padT + ((max - c.low) / range) * ch;

        const up = c.close >= c.open;
        ctx.strokeStyle = up ? "#26a69a" : "#ef5350";
        ctx.fillStyle = up ? "#26a69a" : "#ef5350";

        ctx.beginPath();
        ctx.moveTo(x, yH);
        ctx.lineTo(x, yL);
        ctx.stroke();

        const top = Math.min(yO, yC);
        const bh = Math.max(1.5, Math.abs(yC - yO));
        ctx.fillRect(x - bodyW / 2, top, bodyW, bh);
      }
    }

    async function load() {
      const symMap = {
        "SILVER": "XAG",
        "HG1": "COPPER",
        "USOIL": "WTI"
      };
      const fsym = symMap[key] || key;
      try {
        const url = `https://cryptocompare.com{fsym}&tsym=USD&limit=70&aggregate=15`;
        const r = await fetch(url);
        const j = await r.json();
        const list = j?.Data?.Data;
        if (!list || !list.length) throw new Error("No data");
        candles = list;
        const last = candles.at(-1).close;
        const fmtLast = last >= 100 ? last.toLocaleString() : (last >= 1 ? last.toFixed(3) : last.toFixed(6));
        document.getElementById("prc").innerText = "$" + fmtLast;
        document.getElementById("msg").style.display = "none";
        draw();
      } catch (e) {
        document.getElementById("msg").innerText = "Chart unavailable for " + key;
      }
    }

    window.addEventListener("resize", draw);
    load();
  </script>
</body>
</html>
