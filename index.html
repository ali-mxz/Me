<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Watch Lizard Live Chart</title>
  <script src="https://telegram.org"></script>
  <script src="https://unpkg.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #131722;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #header {
      padding: 10px 14px;
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
    }
    #price-tag { color: #26a69a; font-family: monospace; font-size: 15px; }
    #chart { flex: 1; width: 100%; }
    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 13px;
      color: #787b86;
    }
  </style>
</head>
<body>
  <div id="header">
    <span id="sym-title">Loading...</span>
    <span id="price-tag">--</span>
  </div>
  <div id="status">Loading live candles...</div>
  <div id="chart"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let rawParam = tg.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get("tgWebAppStartParam") || "BINANCE_BTCUSDT";
    let cleanSym = rawParam.split("_").pop().replace("USDT", "").replace("USD", "");
    if (cleanSym === "TON") cleanSym = "GRAM (TON)";
    document.getElementById("sym-title").innerText = "🦎 " + cleanSym + " / USD (15m)";

    const chart = LightweightCharts.createChart(document.getElementById("chart"), {
      layout: { background: { color: "#131722" }, textColor: "#d1d4dc" },
      grid: { vertLines: { color: "#1f2937" }, horzLines: { color: "#1f2937" } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      timeScale: { timeVisible: true, secondsVisible: false, borderColor: "#2a2e39" },
      rightPriceScale: { borderColor: "#2a2e39" }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: "#26a69a",
      downColor: "#ef5350",
      borderVisible: false,
      wickUpColor: "#26a69a",
      wickDownColor: "#ef5350"
    });

    // دریافت کندل‌های زنده ۱۵ دقیقه‌ای از Kraken (بدون فیلتر و سریع)
    const krakenMap = {
      "BTC": "XBTUSD", "ETH": "ETHUSD", "XRP": "XRPUSD", "SOL": "SOLUSD",
      "PAXG": "PAXGUSD", "USDT": "USDTZUSD", "TON": "TONUSD", "DOGE": "XDGUSD",
      "LINK": "LINKUSD", "XMR": "XMRUSD", "ADA": "ADAUSD", "ZEC": "ZECUSD",
      "SUI": "SUIUSD", "LTC": "LTCUSD", "TRX": "TRXUSD"
    };

    let baseKey = rawParam.split("_").pop().replace("USDT", "").replace("USD", "");
    let pair = krakenMap[baseKey] || "XBTUSD";

    fetch("https://kraken.com" + pair + "&interval=15")
      .then(r => r.json())
      .then(data => {
        const res = data.result;
        const key = Object.keys(res).find(k => k !== "last");
        const candles = res[key].slice(-100).map(c => ({
          time: c[0] + 12600, // تنظیم روی ساعت تهران (+3:30)
          open: parseFloat(c[1]),
          high: parseFloat(c[2]),
          low: parseFloat(c[3]),
          close: parseFloat(c[4])
        }));
        candleSeries.setData(candles);
        const lastClose = candles[candles.length - 1].close;
        document.getElementById("price-tag").innerText = "$" + lastClose;
        document.getElementById("status").style.display = "none";
        chart.timeScale().fitContent();
      })
      .catch(() => {
        document.getElementById("status").innerText = "Chart data unavailable for this symbol.";
      });

    window.addEventListener("resize", () => {
      chart.applyOptions({ width: window.innerWidth, height: window.innerHeight - 42 });
    });
  </script>
</body>
</html>
