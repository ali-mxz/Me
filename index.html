<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Watch Lizard Live Chart</title>
  <script src="https://telegram.org"></script>
  <style>
    html, body, .tradingview-widget-container, #tv-chart {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      background-color: #131722;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="tradingview-widget-container">
    <div id="tv-chart"></div>
  </div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let rawParam = tg.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get("tgWebAppStartParam") || "BINANCE_BTCUSDT";
    let tvSymbol = rawParam.replace("_", ":");
    if (tvSymbol === "COMEX:HG1") tvSymbol = "COMEX:HG1!";

    const script = document.createElement("script");
    script.type = "text/javascript";
    script.src = "https://tradingview.com";
    script.async = true;
    script.innerHTML = JSON.stringify({
      "autosize": true,
      "symbol": tvSymbol,
      "interval": "15",
      "timezone": "Asia/Tehran",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "allow_symbol_change": true,
      "calendar": false,
      "support_host": "https://tradingview.com"
    });
    document.getElementById("tv-chart").appendChild(script);
  </script>
</body>
</html>
