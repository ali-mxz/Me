<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lizhart</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #131722;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #top {
      padding: 12px 16px;
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #sym { font-size: 16px; font-weight: 700; }
    #prc { font-size: 16px; font-weight: 700; color: #26a69a; font-family: monospace; }
    #wrap { flex: 1; position: relative; width: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #848e9c;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="top">
    <span id="sym">🦎 Loading...</span>
    <span id="prc">--</span>
  </div>
  <div id="wrap">
    <div id="msg">Fetching market data...</div>
    <canvas id="cv"></canvas>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let param = tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get("tgWebAppStartParam") || "BINANCE_BTCUSDT";
    let key = param.split("_").pop().replace("USDT", "").replace("USD", "");
    document.getElementById("sym").innerText = "🦎 " + (key === "TON" ? "GRAM" : key) + " / USD";

    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");
    let candles = [];

    function draw() {
      if (!candles.length) return;
      const dpr = window.devicePixelRatio || 1;
      const w = cv.clientWidth;
      const h = cv.clientHeight;
      cv.width = w * dpr;
      cv.height = h * dpr;
      ctx.scale(dpr, dpr);

      ctx.fillStyle = "#131722";
      ctx.fillRect(0, 0, w, h);

      const padR = 58, padT = 16, padB = 24;
      const cw = w - padR;
      const ch = h - padT - padB;

      let min = Infinity, max = -Infinity;
      candles.forEach(c => {
        if (c.l < min) min = c.l;
        if (c.h > max) max = c.h;
      });
      const range = (max - min) || 1;

      // خطوط شبکه افقی و اعداد قیمت
      ctx.strokeStyle = "#1e222d";
      ctx.fillStyle = "#787b86";
      ctx.font = "11px monospace";
      ctx.textAlign = "left";
      for (let i = 0; i <= 4; i++) {
        const y = padT + (ch * i / 4);
        const val = max - (range * i / 4);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(cw, y);
        ctx.stroke();
        ctx.fillText(val >= 10 ? val.toFixed(2) : val.toFixed(5), cw + 6, y + 4);
      }

      // رسم کندل‌ها
      const step = cw / candles.length;
      const bodyW = Math.max(2, step * 0.65);

      candles.forEach((c, i) => {
        const x = i * step + step / 2;
        const yO = padT + ((max - c.o) / range) * ch;
        const yC = padT + ((max - c.c) / range) * ch;
        const yH = padT + ((max - c.h) / range) * ch;
        const yL = padT + ((max - c.l) / range) * ch;

        const up = c.c >= c.o;
        ctx.strokeStyle = up ? "#26a69a" : "#ef5350";
        ctx.fillStyle = up ? "#26a69a" : "#ef5350";

        ctx.beginPath();
        ctx.moveTo(x, yH);
        ctx.lineTo(x, yL);
        ctx.stroke();

        const top = Math.min(yO, yC);
        const bh = Math.max(1.5, Math.abs(yC - yO));
        ctx.fillRect(x - bodyW / 2, top, bodyW, bh);
      });
    }

    async function load() {
      const kMap = {
        "BTC": "XBTUSD", "ETH": "ETHUSD", "XRP": "XRPUSD", "SOL": "SOLUSD",
        "PAXG": "PAXGUSD", "USDT": "USDTZUSD", "TON": "TONUSD", "DOGE": "XDGUSD",
        "LINK": "LINKUSD", "XMR": "XMRUSD", "ADA": "ADAUSD", "ZEC": "ZECUSD",
        "SUI": "SUIUSD", "LTC": "LTCUSD", "TRX": "TRXUSD"
      };
      const pair = kMap[key] || "XBTUSD";
      try {
        const r = await fetch("https://kraken.com" + pair + "&interval=15");
        const j = await r.json();
        const k = Object.keys(j.result).find(x => x !== "last");
        candles = j.result[k].slice(-70).map(x => ({
          o: +x[1], h: +x[2], l: +x[3], c: +x[4]
        }));
        const last = candles[candles.length - 1].c;
        document.getElementById("prc").innerText = "$" + (last >= 10 ? last.toLocaleString() : last);
        document.getElementById("msg").style.display = "none";
        draw();
      } catch (e) {
        document.getElementById("msg").innerText = "Connection blocked or symbol unsupported. Try with VPN.";
      }
    }

    window.addEventListener("resize", draw);
    load();
  </script>
</body>
</html>
