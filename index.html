<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Watch Lizard Live Chart</title>
  <script src="https://telegram.org"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #131722;
      overflow: hidden;
    }
    #tv-chart {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="tv-chart"></div>
  <script type="text/javascript" src="https://tradingview.com"></script>
  <script type="text/javascript">
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // دریافت نماد ارز از لینک تلگرام (مثلاً BINANCE_BTCUSDT -> BINANCE:BTCUSDT)
    let rawParam = tg.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get("tgWebAppStartParam") || "BINANCE_BTCUSDT";
    let tvSymbol = rawParam.replace("_", ":");
    if (tvSymbol === "COMEX:HG1") tvSymbol = "COMEX:HG1!";

    new TradingView.widget({
      "autosize": true,
      "symbol": tvSymbol,
      "interval": "15",
      "timezone": "Asia/Tehran",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#131722",
      "enable_publishing": false,
      "hide_top_toolbar": false,
      "hide_legend": false,
      "save_image": false,
      "container_id": "tv-chart"
    });
  </script>
</body>
</html>
